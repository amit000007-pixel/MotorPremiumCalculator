<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Motor Premium Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            color: #222;
        }

        .header {
            background: #003b73;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            max-width: 1000px;
            margin: 25px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #003b73;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .addon {
            margin: 10px 0;
        }

        .addon input {
            width: auto;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            font-size: 18px;
        }

        .total {
            font-size: 25px;
            font-weight: bold;
            color: #008000;
        }

        @media(max-width: 650px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Motor Premium Calculator</h1>
    <p>Motor Insurance Premium Calculator</p>
</div>

<div class="container">

    <div class="card">
        <h2>Vehicle Details</h2>

        <div class="grid">

            <div>
                <label>Vehicle Type</label>
                <select id="vehicleType">
                    <option value="car">Private Car</option>
                    <option value="2w">Two Wheeler</option>
                    <option value="commercial">Commercial Vehicle</option>
                </select>
            </div>

            <div>
                <label>IDV (₹)</label>
                <input type="number" id="idv" placeholder="Enter IDV">
            </div>

            <div>
                <label>Registration Date</label>
                <input type="date" id="registrationDate">
            </div>

            <div>
                <label>CC / GVW</label>
                <input type="number" id="cc" placeholder="Enter CC / GVW">
            </div>

        </div>
    </div>


    <div class="card">
        <h2>Discount / Premium</h2>

        <div class="grid">

            <div>
                <label>OD Rate (%)</label>
                <input type="number" id="odRate" step="0.001">
            </div>

            <div>
                <label>NCB (%)</label>
                <select id="ncb">
                    <option value="0">0%</option>
                    <option value="20">20%</option>
                    <option value="25">25%</option>
                    <option value="35">35%</option>
                    <option value="45">45%</option>
                    <option value="50">50%</option>
                </select>
            </div>

        </div>
    </div>


    <div class="card">
        <h2>Add-ons</h2>

        <div class="addon">
            <label>
                <input type="checkbox" id="zeroDep">
                Zero Depreciation
            </label>
        </div>

        <div class="addon">
            <label>
                <input type="checkbox" id="engineProtect">
                Engine Protect
            </label>
        </div>

        <div class="addon">
            <label>
                <input type="checkbox" id="rti">
                Return To Invoice
            </label>
        </div>

        <div class="addon">
            <label>
                <input type="checkbox" id="rsa">
                Roadside Assistance
            </label>
        </div>

        <div class="addon">
            <label>
                <input type="checkbox" id="keyCover">
                Key Cover
            </label>
        </div>

        <p>
            <strong>Key Cover Premium:</strong>
            ₹250
        </p>

    </div>


    <div class="card">
        <button onclick="calculatePremium()">
            Calculate Premium
        </button>
    </div>


    <div class="card result">
        <h2>Premium Summary</h2>

        <p>Own Damage: ₹<span id="ownDamage">0</span></p>

        <p>Add-ons: ₹<span id="addons">0</span></p>

        <p>Third Party: ₹<span id="thirdParty">0</span></p>

        <p>GST: ₹<span id="gst">0</span></p>

        <hr>

        <p class="total">
            Total Premium: ₹<span id="totalPremium">0</span>
        </p>
    </div>

</div>


<script>

function calculatePremium() {

    const idv = Number(document.getElementById("idv").value) || 0;

    const odRate =
        Number(document.getElementById("odRate").value) || 0;

    const ncb =
        Number(document.getElementById("ncb").value) || 0;

    const vehicleType =
        document.getElementById("vehicleType").value;


    // Own Damage
    let ownDamage = idv * odRate / 100;


    // NCB
    ownDamage =
        ownDamage - (ownDamage * ncb / 100);


    // Add-ons
    let addons = 0;


    if (document.getElementById("zeroDep").checked) {
        addons += 1000;
    }

    if (document.getElementById("engineProtect").checked) {
        addons += 500;
    }

    if (document.getElementById("rti").checked) {
        addons += 500;
    }

    if (document.getElementById("rsa").checked) {
        addons += 250;
    }


    // KEY COVER
    if (document.getElementById("keyCover").checked) {

        if (vehicleType === "2w") {

            addons += 50;

        } else {

            addons += 250;

        }
    }


    // Example TP amount
    let thirdParty = 0;

    if (vehicleType === "2w") {
        thirdParty = 714;
    } else {
        thirdParty = 3416;
    }


    const subtotal =
        ownDamage + addons + thirdParty;

    const gst =
        subtotal * 0.18;

    const total =
        subtotal + gst;


    document.getElementById("ownDamage").textContent =
        Math.round(ownDamage);

    document.getElementById("addons").textContent =
        Math.round(addons);

    document.getElementById("thirdParty").textContent =
        Math.round(thirdParty);

    document.getElementById("gst").textContent =
        Math.round(gst);

    document.getElementById("totalPremium").textContent =
        Math.round(total);
}

</script>

</body>
</html>
